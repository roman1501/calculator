<div class="wrapper">
  <mat-form-field class="calc-input" appearance="outline" [formGroup]="formTravel">
    <mat-label>Період поїздки</mat-label>

    <mat-date-range-input [rangePicker]="picker">
      <input matStartDate formControlName="beginningDate" readonly>
      <input matEndDate formControlName="endingDate" readonly>
    </mat-date-range-input>

    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>

    <mat-date-range-picker
      #picker
      appRangeDaysTooltip
      [formGroup]="formTravel">
    </mat-date-range-picker>
  </mat-form-field>

</div>
